name: Build and Push Docker Image

# 什么时候自动构建镜像：
#   1. 打 tag（如 v1.0.0）—— 推荐方式，会打出对应版本标签
#   2. 手动触发（Actions 页面点 Run workflow）
on:
  push:
    tags:
      - "v*.*.*"          # 例：v1.0.0
      - "v*.*"            # 例：v1.0
  workflow_dispatch:       # 允许在 GitHub 网页上手动点按钮运行

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 注意：Docker Hub 用户名来自 secret，不能在顶层 env 里拼进镜像名，
      # 否则可能解析成空值导致镜像名变成 "/emby-missing-episodes"。
      # 这里先解析出来，供后续步骤使用。
      - name: 解析镜像名
        id: repo
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::未配置 DOCKERHUB_USERNAME secret，请先在仓库 Settings → Secrets and variables → Actions 里添加"
            exit 1
          fi
          echo "image=$DOCKERHUB_USERNAME/emby-missing-episodes" >> "$GITHUB_OUTPUT"

      - name: 设置 QEMU（支持多架构，可选）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签和元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.image }}
          tags: |
            # 打 v1.2.3 tag 时生成 1.2.3 / 1.2 / 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # 手动触发时用 short sha 做标签
            type=sha,prefix=sha-,enable=${{ github.event_name == 'workflow_dispatch' }}
          # latest 交给 flavor 管理：打正式 tag 时自动维护 latest，
          # 避免「先发 v2.0.0 再发 v1.x 补丁」时 latest 被旧版本覆盖。
          flavor: |
            latest=auto

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          # 想同时出 amd64/arm64 两种架构（群晖/树莓派等 ARM 设备可用）就取消注释
          # platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
