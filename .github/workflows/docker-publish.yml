name: Build and Push Docker Image

# 什么时候自动构建镜像：
#   1. push 到 main 分支 —— 自动构建并更新 latest 标签
#      （改了代码 push 上来，别人 docker compose pull 就能拿到新版）
#   2. 打 tag（如 v1.0.0）—— 额外产出 1.0.0 / 1.0 / 1 等正式版本号
#   3. 手动触发（Actions 页面点 Run workflow）
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"          # 例：v1.0.0
      - "v*.*"            # 例：v1.0
  workflow_dispatch:       # 允许在 GitHub 网页上手动点按钮运行

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 推镜像到 GHCR 必须要有这个权限（写 packages）
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU（支持多架构）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 GitHub Container Registry（GHCR）
      # 用内置的 GITHUB_TOKEN，零配置、无需任何 Secret
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签和元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 镜像名必须全小写，GHCR 要求
          images: ghcr.io/${{ github.repository }}
          tags: |
            # ---- 打 v1.2.3 tag 时：生成 1.2.3 / 1.2 / 1 ----
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

            # ---- push 到 main 时：滚动更新 latest ----
            # 只在 main 分支的 push 事件里生效，打 tag 时不会重复执行
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

            # ---- 手动触发时：用 short sha 做标签，便于回溯是哪次提交 ----
            type=sha,prefix=sha-,enable=${{ github.event_name == 'workflow_dispatch' }}

          # semver 标签出现时自动维护 latest（打 tag 也更新 latest）
          flavor: |
            latest=auto

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          # 同时出 amd64 / arm64 两种架构（群晖、树莓派等 ARM 设备可用）
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
